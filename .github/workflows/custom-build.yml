name: SynclairQGC 0.7.1 Packages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: synclair-0.7.1-windows-package
  cancel-in-progress: false

jobs:
  package:
    name: ${{ matrix.platform }} package
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows-x64
            runner: windows-2022
            qt_host: windows
            qt_arch: win64_msvc2022_64
            preset: Windows
            filename: SynclairQGC-installer-AMD64.exe
    defaults:
      run:
        shell: bash
    env:
      SOURCE_SHA: 963d0472929f095b94139954b1835a2cf2fec743

    steps:
      - name: Checkout release sources
        uses: actions/checkout@v7
        with:
          ref: 963d0472929f095b94139954b1835a2cf2fec743
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Set local build version
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          # The local tag supplies version metadata without publishing a tag or release.
          if git show-ref --verify --quiet refs/tags/v0.7.1; then
            test "$(git rev-parse 'v0.7.1^{commit}')" = "$SOURCE_SHA"
          else
            git tag v0.7.1 "$SOURCE_SHA"
          fi
          test "$(git describe --tags --exact-match HEAD)" = v0.7.1

      - name: Set up build tools and Qt
        uses: ./.github/actions/build-setup
        with:
          qt-host: ${{ matrix.qt_host }}
          qt-arch: ${{ matrix.qt_arch }}
          build-type: Release
          save-cache: 'false'
          aqt-source: git+https://github.com/miurahr/aqtinstall.git@8d961e61720b3c06583517fbc68d57ec0a4e9f95

      - name: Install platform dependencies
        uses: ./.github/actions/install-dependencies
        with:
          nsis: ${{ runner.os == 'Windows' && 'true' || 'false' }}

      - name: Restore code-generator dependencies
        uses: ./.github/actions/setup-python
        with:
          groups: scripts

      - name: Configure SynclairQGC
        uses: ./.github/actions/cmake-configure
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: Release
          preset: ${{ matrix.preset }}
          stable: 'true'
          testing: 'false'
          extra-args: >-
            -DQGC_CUSTOM_DIR=custom
            -DQGC_BUILD_TESTING=OFF
            -DQGC_ENABLE_GST_VIDEOSTREAMING=ON
            ${{ runner.os == 'Windows' && '-DQGC_CPACK_GENERATOR=NSIS' || '' }}

      - name: Build SynclairQGC
        uses: ./.github/actions/cmake-build
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: Release
          parallel-jobs: '2'

      - name: Create Linux AppImage
        if: runner.os == 'Linux'
        uses: ./.github/actions/cmake-install
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: Release

      - name: Create Windows installer
        if: runner.os == 'Windows'
        uses: ./.github/actions/cmake-build
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: Release
          target: qgc-package
          parallel: 'false'

      - name: Collect package and SHA-256 checksum
        shell: python
        env:
          BUILD_DIR: ${{ runner.temp }}/build
          OUTPUT_DIR: ${{ runner.temp }}/packages
          PACKAGE_FILE: ${{ matrix.filename }}
        run: |
          import hashlib
          import os
          from pathlib import Path
          import shutil

          build = Path(os.environ['BUILD_DIR'])
          header = (build / 'qgc_version.h').read_text()
          if '#define QGC_APP_VERSION_STR "v0.7.1"' not in header:
              raise SystemExit('Unexpected application version')
          if '#define QGC_APP_NAME "SynclairQGC"' not in header:
              raise SystemExit('Unexpected application name')
          package = build / os.environ['PACKAGE_FILE']
          if not package.is_file() or package.stat().st_size == 0:
              raise SystemExit(f'Missing or empty package: {package}')
          with package.open('rb') as stream:
              digest = hashlib.file_digest(stream, 'sha256').hexdigest()
          checksum = package.with_name(package.name + '.sha256')
          if checksum.exists():
              fields = checksum.read_text().split()
              if fields != [digest, package.name]:
                  raise SystemExit('Existing package checksum does not match')
          output = Path(os.environ['OUTPUT_DIR'])
          output.mkdir(parents=True, exist_ok=True)
          shutil.copy2(package, output / package.name)
          (output / checksum.name).write_text(f'{digest}  {package.name}\n')
          print(f'{package.name}: {digest}')

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: SynclairQGC-0.7.1-${{ matrix.platform }}
          path: ${{ runner.temp }}/packages/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
